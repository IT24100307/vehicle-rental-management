<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Customer List</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container mt-4">
      <h1>Customer Management</h1>

      <div class="mb-3">
        <a th:href="@{/customer/new}" class="btn btn-primary"
          >Add New Customer</a
        >
      </div>

      <div class="alert alert-info" th:if="${customers.empty}">
        No customers found. Add a new customer to get started.
      </div>

      <table class="table table-striped" th:if="${!customers.empty}">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Contact</th>
            <th>Vehicle ID</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="customer : ${customers}">
            <td th:text="${customer.cusID}"></td>
            <td th:text="${customer.cusName}"></td>
            <td th:text="${customer.contactNum}"></td>
            <td th:text="${customer.rentedVehicle}"></td>
            <td>
              <a
                th:href="@{/customer/{id}(id=${customer.cusID})}"
                class="btn btn-sm btn-info"
                >View</a
              >
              <a
                th:href="@{/customer/edit/{id}(id=${customer.cusID})}"
                class="btn btn-sm btn-warning"
                >Edit</a
              >
              <a
                th:href="@{/customer/delete/{id}(id=${customer.cusID})}"
                class="btn btn-sm btn-danger"
                onclick="return confirm('Are you sure you want to delete this customer?')"
                >Delete</a
              >
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
