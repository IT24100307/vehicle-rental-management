<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Edit Customer</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container mt-4">
      <h1>Edit Customer</h1>

      <form
        th:action="@{/customer/update}"
        th:object="${customer}"
        method="post"
      >
        <!-- Hidden field for ID -->
        <input type="hidden" th:field="*{cusID}" />

        <div class="mb-3">
          <label for="cusName" class="form-label">Customer Name</label>
          <input
            type="text"
            class="form-control"
            id="cusName"
            th:field="*{cusName}"
            required
          />
        </div>

        <div class="mb-3">
          <label for="contactNum" class="form-label">Contact Number</label>
          <input
            type="number"
            class="form-control"
            id="contactNum"
            th:field="*{contactNum}"
            required
          />
        </div>

        <div class="mb-3">
          <label for="driverLicenseNumber" class="form-label"
            >Driver License Number</label
          >
          <input
            type="number"
            class="form-control"
            id="driverLicenseNumber"
            th:field="*{driverLicenseNumber}"
            required
          />
        </div>

        <div class="mb-3">
          <label for="rentedVehicle" class="form-label"
            >Rented Vehicle ID</label
          >
          <input
            type="number"
            class="form-control"
            id="rentedVehicle"
            th:field="*{rentedVehicle}"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary">Update Customer</button>
        <a th:href="@{/customer}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
