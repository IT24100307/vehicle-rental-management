<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Details</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h1>Customer Details</h1>
        
        <div class="card">
            <div class="card-header">
                <h3 th:text="${customer.cusName}"></h3>
            </div>
            <div class="card-body">
                <p><strong>Customer ID:</strong> <span th:text="${customer.cusID}"></span></p>
                <p><strong>Contact Number:</strong> <span th:text="${customer.contactNum}"></span></p>
                <p><strong>Driver License Number:</strong> <span th:text="${customer.driverLicenseNumber}"></span></p>
                <p><strong>Rented Vehicle ID:</strong> <span th:text="${customer.rentedVehicle}"></span></p>
            </div>
            <div class="card-footer">
                <a th:href="@{/customer}" class="btn btn-primary">Back to List</a>
                <a th:href="@{/customer/edit/{id}(id=${customer.cusID})}" class="btn btn-warning">Edit</a>
                <a th:href="@{/customer/delete/{id}(id=${customer.cusID})}" 
                   class="btn btn-danger"
                   onclick="return confirm('Are you sure you want to delete this customer?')">Delete</a>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
