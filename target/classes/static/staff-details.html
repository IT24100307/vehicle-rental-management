<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Details - HTML Codex Template</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        body {
            font-family: 'Arial', sans-serif;
        }
        .container {
            margin-top: 30px;
        }
        .detail-card {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        footer {
            background-color: #f8f9fa;
            padding: 10px 0;
            text-align: center;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
<!-- Header -->
<header class="bg-primary text-white text-center py-4">
    <h1>Staff Details</h1>
</header>

<!-- Main Content -->
<div class="container">
    <div id="detailCard" class="detail-card">
        <h3>Staff Information</h3>
        <p><strong>ID:</strong> <span id="detailId"></span></p>
        <p><strong>First Name:</strong> <span id="detailFirstName"></span></p>
        <p><strong>Last Name:</strong> <span id="detailLastName"></span></p>
        <p><strong>Email:</strong> <span id="detailEmail"></span></p>
        <p><strong>Phone:</strong> <span id="detailPhoneNumber"></span></p>
        <p><strong>Department:</strong> <span id="detailDepartment"></span></p>
        <button class="btn btn-primary" onclick="window.location.href='index.html'">Back to List</button>
    </div>
</div>

<!-- Footer -->
<footer>
    <p>Template by <a href="https://htmlcodex.com" target="_blank">HTML Codex</a> | Licensed under <a href="https://creativecommons.org/licenses/by/4.0" target="_blank">CC BY 4.0</a></p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script>
    async function fetchStaffDetails() {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        if (id) {
            const response = await fetch(`/api/staff/${id}`);
            const staff = await response.json();
            document.getElementById('detailId').textContent = staff.id;
            document.getElementById('detailFirstName').textContent = staff.firstName;
            document.getElementById('detailLastName').textContent = staff.lastName;
            document.getElementById('detailEmail').textContent = staff.email;
            document.getElementById('detailPhoneNumber').textContent = staff.phoneNumber;
            document.getElementById('detailDepartment').textContent = staff.department;
        } else {
            alert('No staff ID provided.');
            window.location.href = 'index.html';
        }
    }

    window.onload = fetchStaffDetails;
</script>
</body>
</html>
