<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        .header {
            background-color: #343a40;
            color: white;
            padding: 20px 0;
            margin-bottom: 30px;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            border: none;
        }
        .card-header {
            background-color: #007bff;
            color: white;
            border-radius: 10px 10px 0 0 !important;
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        .btn-primary:hover {
            background-color: #0069d9;
            border-color: #0062cc;
        }
        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
        }
        .btn-danger:hover {
            background-color: #c82333;
            border-color: #bd2130;
        }
        .btn-success {
            background-color: #28a745;
            border-color: #28a745;
        }
        .btn-success:hover {
            background-color: #218838;
            border-color: #1e7e34;
        }
        .event-card {
            transition: transform 0.3s ease;
        }
        .event-card:hover {
            transform: translateY(-5px);
        }
        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }
        .badge {
            font-size: 0.9em;
        }
        .vehicle-badge {
            background-color: #6c757d;
            margin-right: 5px;
            margin-bottom: 5px;
        }
        #eventDate {
            margin-bottom: 15px;
        }
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1050;
        }
    </style>
</head>
<body>
    <div class="header text-center">
        <h1><i class="fas fa-calendar-alt me-2"></i>Event Management System</h1>
        <p class="lead">Manage your events efficiently</p>
    </div>

    <div class="container">
        <div class="row">
            <!-- Event Form Card -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-plus-circle me-2"></i>Add/Edit Event</h5>
                    </div>
                    <div class="card-body">
                        <form id="eventForm">
                            <div class="mb-3">
                                <label for="eventId" class="form-label">Event ID</label>
                                <input type="text" class="form-control" id="eventId" placeholder="e.g., EVT001" required>
                            </div>
                            <div class="mb-3">
                                <label for="eventType" class="form-label">Event Type</label>
                                <select class="form-select" id="eventType" required onchange="showEventSpecificFields()">
                                    <option value="" selected disabled>Select Event Type</option>
                                    <option value="Airport Transfer">Airport Transfer</option>
                                    <option value="Long Trip">Long Trip</option>
                                    <option value="Wedding Package">Wedding Package</option>
                                    <option value="Special">Special</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="basePrice" class="form-label">Base Price (Rs.)</label>
                                <input type="number" class="form-control" id="basePrice" placeholder="e.g., 5000" step="0.01" min="0" required>
                            </div>
                            <div class="mb-3">
                                <label for="vehicleTypes" class="form-label">Vehicle Types</label>
                                <input type="text" class="form-control" id="vehicleTypes" placeholder="e.g., Car, Van, Bus" required>
                                <div class="form-text">Enter comma-separated vehicle types</div>
                            </div>
                            
                            <!-- Airport Transfer specific fields -->
                            <div id="airportTransferFields" style="display:none;">
                                <div class="mb-3">
                                    <label for="airportName" class="form-label">Airport Name</label>
                                    <input type="text" class="form-control" id="airportName" placeholder="e.g., Bandaranaike International Airport">
                                </div>
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="isRoundTrip">
                                    <label class="form-check-label" for="isRoundTrip">Round Trip</label>
                                </div>
                            </div>

                            <!-- Long Trip specific fields will be added here -->
                            <div id="longTripFields" style="display:none;">
                                <!-- Fields for Long Trip can be added here -->
                            </div>

                            <!-- Wedding Package specific fields will be added here -->
                            <div id="weddingPackageFields" style="display:none;">
                                <!-- Fields for Wedding Package can be added here -->
                            </div>
                            
                            <div class="mb-3">
                                <label for="eventDate" class="form-label">Scheduled Date</label>
                                <input type="datetime-local" class="form-control" id="eventDate">
                            </div>
                            <div class="mb-3">
                                <label for="eventStatus" class="form-label">Status</label>
                                <select class="form-select" id="eventStatus">
                                    <option value="PENDING" selected>PENDING</option>
                                    <option value="CONFIRMED">CONFIRMED</option>
                                    <option value="CANCELLED">CANCELLED</option>
                                    <option value="COMPLETED">COMPLETED</option>
                                </select>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-primary" onclick="createEvent()">
                                    <i class="fas fa-save me-2"></i>Create Event
                                </button>
                                <button type="button" class="btn btn-success" onclick="updateEvent()">
                                    <i class="fas fa-edit me-2"></i>Update Event
                                </button>
                                <button type="button" class="btn btn-danger" onclick="deleteEvent()">
                                    <i class="fas fa-trash-alt me-2"></i>Delete Event
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-filter me-2"></i>Filter Options</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="filterType" class="form-label">Filter by Event Type</label>
                            <select class="form-select" id="filterType" onchange="filterEvents()">
                                <option value="All" selected>All Types</option>
                                <option value="Airport Transfer">Airport Transfer</option>
                                <option value="Long Trip">Long Trip</option>
                                <option value="Wedding Package">Wedding Package</option>
                                <option value="Special">Special</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="filterStatus" class="form-label">Filter by Status</label>
                            <select class="form-select" id="filterStatus" onchange="filterEvents()">
                                <option value="All" selected>All Statuses</option>
                                <option value="PENDING">PENDING</option>
                                <option value="CONFIRMED">CONFIRMED</option>
                                <option value="CANCELLED">CANCELLED</option>
                                <option value="COMPLETED">COMPLETED</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Events List Card -->
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-list me-2"></i>Events</h5>
                        <button class="btn btn-light btn-sm" onclick="getAllEvents()">
                            <i class="fas fa-sync-alt me-1"></i>Refresh
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="eventList" class="row"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container for Notifications -->
    <div class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const apiUrl = 'http://localhost:8080/api/events';
        let allEvents = [];

        // Function to show/hide event-specific fields
        function showEventSpecificFields() {
            const eventType = document.getElementById('eventType').value;
            
            // Hide all specific fields first
            document.getElementById('airportTransferFields').style.display = 'none';
            document.getElementById('longTripFields').style.display = 'none';
            document.getElementById('weddingPackageFields').style.display = 'none';
            
            // Show fields based on event type
            if (eventType === 'Airport Transfer') {
                document.getElementById('airportTransferFields').style.display = 'block';
            } else if (eventType === 'Long Trip') {
                document.getElementById('longTripFields').style.display = 'block';
            } else if (eventType === 'Wedding Package') {
                document.getElementById('weddingPackageFields').style.display = 'block';
            }
        }

        // Show notification toast
        function showToast(message, type = 'success') {
            const toastContainer = document.querySelector('.toast-container');
            const toastId = `toast-${Date.now()}`;
            const toastHTML = `
                <div id="${toastId}" class="toast align-items-center text-white bg-${type}" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="d-flex">
                        <div class="toast-body">
                            <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'} me-2"></i>
                            ${message}
                        </div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                </div>
            `;
            toastContainer.insertAdjacentHTML('beforeend', toastHTML);
            
            const toastElement = document.getElementById(toastId);
            const toast = new bootstrap.Toast(toastElement, { autohide: true, delay: 3000 });
            toast.show();
            
            // Remove toast from DOM after it's hidden
            toastElement.addEventListener('hidden.bs.toast', () => {
                toastElement.remove();
            });
        }

        // Format date for display
        function formatDate(dateString) {
            if (!dateString) return 'Not scheduled';
            const date = new Date(dateString);
            return date.toLocaleString();
        }

        // Get status badge HTML
        function getStatusBadge(status) {
            const statusColors = {
                'PENDING': 'warning',
                'CONFIRMED': 'primary',
                'CANCELLED': 'danger',
                'COMPLETED': 'success'
            };
            const color = statusColors[status] || 'secondary';
            return `<span class="badge bg-${color}">${status}</span>`;
        }

        // Get all events
        async function getAllEvents() {
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error('Failed to fetch events');
                }
                allEvents = await response.json();
                displayEvents(allEvents);
                showToast('Events loaded successfully');
            } catch (error) {
                console.error('Error fetching events:', error);
                showToast(error.message, 'danger');
            }
        }

        // Display events based on filter
        function filterEvents() {
            const typeFilter = document.getElementById('filterType').value;
            const statusFilter = document.getElementById('filterStatus').value;
            
            let filteredEvents = [...allEvents];
            
            if (typeFilter !== 'All') {
                filteredEvents = filteredEvents.filter(e => e.eventType === typeFilter);
            }
            
            if (statusFilter !== 'All') {
                filteredEvents = filteredEvents.filter(e => e.status === statusFilter);
            }
            
            displayEvents(filteredEvents);
        }

        // Display events in UI
        function displayEvents(events) {
            const eventList = document.getElementById('eventList');
            if (events.length === 0) {
                eventList.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="fas fa-calendar-times fa-4x mb-3 text-muted"></i>
                        <h5 class="text-muted">No events found</h5>
                    </div>`;
                return;
            }
            
            eventList.innerHTML = events.map(e => `
                <div class="col-md-6 mb-3">
                    <div class="card event-card h-100">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h6 class="mb-0">${e.eventId}</h6>
                            ${getStatusBadge(e.status || 'PENDING')}
                        </div>
                        <div class="card-body">
                            <h5 class="card-title">${e.eventType}</h5>
                            <div class="mb-2">
                                <strong><i class="fas fa-money-bill-wave me-1"></i>Base Price:</strong> 
                                Rs. ${e.basePrice.toFixed(2)}
                            </div>
                            <div class="mb-2">
                                <strong><i class="fas fa-money-bill-wave me-1"></i>Total Price:</strong> 
                                Rs. ${(e.calculateTotalPrice || e.basePrice).toFixed(2)}
                            </div>
                            <div class="mb-2">
                                <strong><i class="fas fa-calendar-day me-1"></i>Scheduled:</strong> 
                                ${formatDate(e.scheduledDate)}
                            </div>
                            <div class="mb-2">
                                <strong><i class="fas fa-car me-1"></i>Vehicles:</strong>
                                <div class="mt-1">
                                    ${e.vehicleTypes.map(v => `<span class="badge vehicle-badge">${v}</span>`).join('')}
                                </div>
                            </div>
                        </div>
                        <div class="card-footer">
                            <button class="btn btn-sm btn-outline-primary" onclick="loadEventToForm('${e.eventId}')">
                                <i class="fas fa-edit me-1"></i>Edit
                            </button>
                            <button class="btn btn-sm btn-outline-danger float-end" onclick="confirmDelete('${e.eventId}')">
                                <i class="fas fa-trash-alt me-1"></i>Delete
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Load selected event to form for editing
        function loadEventToForm(eventId) {
            const event = allEvents.find(e => e.eventId === eventId);
            if (!event) return;
            
            document.getElementById('eventId').value = event.eventId;
            document.getElementById('eventType').value = event.eventType;
            document.getElementById('basePrice').value = event.basePrice;
            document.getElementById('vehicleTypes').value = event.vehicleTypes.join(', ');
            
            // Show the appropriate event-specific fields
            showEventSpecificFields();
            
            // Set event-specific field values
            if (event.eventType === 'Airport Transfer') {
                if (event.airportName) document.getElementById('airportName').value = event.airportName;
                if (event.roundTrip !== undefined) document.getElementById('isRoundTrip').checked = event.roundTrip;
            }
            // Set values for other event types here when implemented
            
            if (event.scheduledDate) {
                // Format date for datetime-local input (YYYY-MM-DDThh:mm)
                const date = new Date(event.scheduledDate);
                const formattedDate = date.toISOString().slice(0, 16);
                document.getElementById('eventDate').value = formattedDate;
            } else {
                document.getElementById('eventDate').value = '';
            }
            
            document.getElementById('eventStatus').value = event.status || 'PENDING';
            
            // Scroll to form
            document.querySelector('.card').scrollIntoView({behavior: 'smooth'});
            showToast(`Event ${eventId} loaded for editing`, 'primary');
        }

        // Confirm delete dialog
        function confirmDelete(eventId) {
            if (confirm(`Are you sure you want to delete event ${eventId}?`)) {
                deleteEventById(eventId);
            }
        }

        // Create new event
        async function createEvent() {
            try {
                const eventId = document.getElementById('eventId').value;
                const eventType = document.getElementById('eventType').value;
                const basePrice = parseFloat(document.getElementById('basePrice').value);
                const vehicleTypes = document.getElementById('vehicleTypes').value
                    .split(',')
                    .map(type => type.trim())
                    .filter(type => type.length > 0);
                const scheduledDate = document.getElementById('eventDate').value;
                const status = document.getElementById('eventStatus').value;
                
                // Validate required fields
                if (!eventId || !eventType || isNaN(basePrice) || vehicleTypes.length === 0) {
                    showToast('Please fill in all required fields', 'danger');
                    return;
                }
                
                // Create event object based on type
                let apiEndpoint = apiUrl;
                let event = {
                    eventId,
                    eventType,
                    basePrice,
                    vehicleTypes,
                    status
                };
                
                // Add event-specific fields based on the event type
                if (eventType === 'Airport Transfer') {
                    apiEndpoint = `${apiUrl}/airport-transfer`;
                    event.airportName = document.getElementById('airportName').value || 'Default Airport';
                    event.roundTrip = document.getElementById('isRoundTrip').checked;
                } else if (eventType === 'Long Trip') {
                    apiEndpoint = `${apiUrl}/long-trip`;
                    // Add Long Trip specific fields here
                } else if (eventType === 'Wedding Package') {
                    apiEndpoint = `${apiUrl}/wedding-package`;
                    // Add Wedding Package specific fields here
                }
                
                if (scheduledDate) {
                    event.scheduledDate = new Date(scheduledDate).toISOString();
                }
                
                console.log('Sending event data to:', apiEndpoint);
                console.log('Event data:', JSON.stringify(event));
                
                const response = await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(event)
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Server error:', response.status, errorText);
                    throw new Error(`Failed to create event: ${response.status} ${errorText || 'Unknown error'}`);
                }
                
                const createdEvent = await response.json();
                console.log('Created event:', createdEvent);
                
                showToast('Event created successfully!');
                clearForm();
                getAllEvents();
                
            } catch (error) {
                console.error('Error creating event:', error);
                showToast(error.message || 'Unknown error occurred', 'danger');
            }
        }

        // Update existing event
        async function updateEvent() {
            try {
                const eventId = document.getElementById('eventId').value;
                
                if (!eventId) {
                    showToast('Please select an event to update', 'danger');
                    return;
                }
                
                const eventType = document.getElementById('eventType').value;
                const basePrice = parseFloat(document.getElementById('basePrice').value);
                const vehicleTypes = document.getElementById('vehicleTypes').value
                    .split(',')
                    .map(type => type.trim())
                    .filter(type => type.length > 0);
                const scheduledDate = document.getElementById('eventDate').value;
                const status = document.getElementById('eventStatus').value;
                
                // Validate required fields
                if (!eventType || isNaN(basePrice) || vehicleTypes.length === 0) {
                    showToast('Please fill in all required fields', 'danger');
                    return;
                }
                
                const event = {
                    eventType,
                    basePrice,
                    vehicleTypes,
                    status
                };
                
                if (scheduledDate) {
                    event.scheduledDate = new Date(scheduledDate).toISOString();
                }
                
                const response = await fetch(`${apiUrl}/${eventId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(event)
                });
                
                if (!response.ok) {
                    throw new Error('Failed to update event');
                }
                
                showToast('Event updated successfully');
                clearForm();
                getAllEvents();
                
            } catch (error) {
                console.error('Error updating event:', error);
                showToast(error.message, 'danger');
            }
        }

        // Delete event by ID
        async function deleteEventById(eventId) {
            try {
                const response = await fetch(`${apiUrl}/${eventId}`, { method: 'DELETE' });
                
                if (!response.ok) {
                    throw new Error('Failed to delete event');
                }
                
                showToast(`Event ${eventId} deleted successfully`);
                clearForm();
                getAllEvents();
                
            } catch (error) {
                console.error('Error deleting event:', error);
                showToast(error.message, 'danger');
            }
        }

        // Delete event from form
        function deleteEvent() {
            const eventId = document.getElementById('eventId').value;
            
            if (!eventId) {
                showToast('Please select an event to delete', 'danger');
                return;
            }
            
            confirmDelete(eventId);
        }

        // Clear form
        function clearForm() {
            document.getElementById('eventForm').reset();
        }

        // Initialize: Get all events when page loads
        document.addEventListener('DOMContentLoaded', getAllEvents);
    </script>
</body>
</html>
