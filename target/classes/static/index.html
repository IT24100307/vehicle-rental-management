<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Service Staff Manager - HTML Codex Template</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        body {
            font-family: 'Arial', sans-serif;
        }
        .container {
            margin-top: 30px;
        }
        .table th {
            background-color: #007bff;
            color: white;
        }
        .form-section {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        footer {
            background-color: #f8f9fa;
            padding: 10px 0;
            text-align: center;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        .direct-access {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<!-- Header -->
<header class="bg-primary text-white text-center py-4">
    <h1>Customer Service Staff Manager</h1>
    <p>A simple management system using HTML Codex template</p>
</header>

<!-- Main Content -->
<div class="container">
    <!-- Add Staff Form -->
    <div id="addForm" class="form-section">
        <h3>Add New Staff</h3>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" class="form-control" id="firstName" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lastName" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="phoneNumber" class="form-label">Phone</label>
                <input type="tel" class="form-control" id="phoneNumber" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="department" class="form-label">Department</label>
                <input type="text" class="form-control" id="department" required>
            </div>
        </div>
        <button class="btn btn-primary" onclick="addStaff()">Add Staff</button>
    </div>
    <button class="btn btn-secondary mb-3" onclick="document.getElementById('addForm').style.display='block'">Show Add Form</button>

    <!-- Direct Access to Staff Details -->
    <div class="direct-access">
        <label for="directStaffId" class="form-label">Enter Staff ID:</label>
        <input type="number" class="form-control" id="directStaffId" style="width: 150px;" placeholder="e.g., 1">
        <button class="btn btn-info" onclick="goToStaffDetails()">Go to Details</button>
    </div>

    <!-- View All Staff Details Button -->
    <button class="btn btn-success mb-3" onclick="window.location.href='all-staff-details.html'">View All Staff Details</button>

    <!-- Staff Table -->
    <table class="table table-bordered table-hover">
        <thead>
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Department</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="staffTableBody"></tbody>
    </table>

    <!-- Edit Staff Form -->
    <div id="editForm" class="form-section" style="display: none;">
        <h3>Edit Staff</h3>
        <input type="hidden" id="editId">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="editFirstName" class="form-label">First Name</label>
                <input type="text" class="form-control" id="editFirstName" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="editLastName" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="editLastName" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="editEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="editEmail" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="editPhoneNumber" class="form-label">Phone</label>
                <input type="tel" class="form-control" id="editPhoneNumber" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="editDepartment" class="form-label">Department</label>
                <input type="text" class="form-control" id="editDepartment" required>
            </div>
        </div>
        <button class="btn btn-primary" onclick="updateStaff()">Update Staff</button>
        <button class="btn btn-secondary" onclick="cancelEdit()">Cancel</button>
    </div>
</div>

<!-- Footer -->
<footer>
    <p>Template by <a href="https://htmlcodex.com" target="_blank">HTML Codex</a> | Licensed under <a href="https://creativecommons.org/licenses/by/4.0" target="_blank">CC BY 4.0</a></p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script>
    async function fetchStaff() {
        try {
            const response = await fetch('/api/staff');
            if (!response.ok) throw new Error('Failed to fetch staff members');
            const staff = await response.json();
            const tbody = document.getElementById('staffTableBody');
            tbody.innerHTML = '';
            staff.forEach(staffMember => {
                const row = document.createElement('tr');
                row.innerHTML = `
                        <td>${staffMember.id}</td>
                        <td>${staffMember.firstName}</td>
                        <td>${staffMember.lastName}</td>
                        <td>${staffMember.email}</td>
                        <td>${staffMember.phoneNumber}</td>
                        <td>${staffMember.department}</td>
                        <td>
                            <button class="btn btn-sm btn-info" onclick="window.location.href='staff-details.html?id=${staffMember.id}'">View Details</button>
                            <button class="btn btn-sm btn-warning" onclick="editStaff(${staffMember.id})">Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteStaff(${staffMember.id})">Delete</button>
                        </td>
                    `;
                tbody.appendChild(row);
            });
        } catch (error) {
            alert('Error fetching staff members: ' + error.message);
        }
    }

    async function addStaff() {
        const staff = {
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            email: document.getElementById('email').value,
            phoneNumber: document.getElementById('phoneNumber').value,
            department: document.getElementById('department').value
        };
        try {
            const response = await fetch('/api/staff', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(staff)
            });
            if (!response.ok) throw new Error('Failed to add staff member');
            document.getElementById('addForm').style.display = 'none';
            clearAddForm();
            fetchStaff();
        } catch (error) {
            alert('Error adding staff member: ' + error.message);
        }
    }

    function clearAddForm() {
        document.getElementById('firstName').value = '';
        document.getElementById('lastName').value = '';
        document.getElementById('email').value = '';
        document.getElementById('phoneNumber').value = '';
        document.getElementById('department').value = '';
    }

    async function editStaff(id) {
        try {
            const response = await fetch(`/api/staff/${id}`);
            if (!response.ok) throw new Error('Failed to fetch staff member');
            const staff = await response.json();
            document.getElementById('editId').value = staff.id;
            document.getElementById('editFirstName').value = staff.firstName;
            document.getElementById('editLastName').value = staff.lastName;
            document.getElementById('editEmail').value = staff.email;
            document.getElementById('editPhoneNumber').value = staff.phoneNumber;
            document.getElementById('editDepartment').value = staff.department;
            document.getElementById('editForm').style.display = 'block';
        } catch (error) {
            alert('Error fetching staff member: ' + error.message);
        }
    }

    async function updateStaff() {
        const staff = {
            id: document.getElementById('editId').value,
            firstName: document.getElementById('editFirstName').value,
            lastName: document.getElementById('editLastName').value,
            email: document.getElementById('editEmail').value,
            phoneNumber: document.getElementById('editPhoneNumber').value,
            department: document.getElementById('editDepartment').value
        };
        try {
            const response = await fetch(`/api/staff/${staff.id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(staff)
            });
            if (!response.ok) throw new Error('Failed to update staff member');
            document.getElementById('editForm').style.display = 'none';
            fetchStaff();
        } catch (error) {
            alert('Error updating staff member: ' + error.message);
        }
    }

    async function deleteStaff(id) {
        if (confirm('Are you sure you want to delete this staff member?')) {
            try {
                const response = await fetch(`/api/staff/${id}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Failed to delete staff member');
                fetchStaff();
            } catch (error) {
                alert('Error deleting staff member: ' + error.message);
            }
        }
    }

    function cancelEdit() {
        document.getElementById('editForm').style.display = 'none';
    }

    function goToStaffDetails() {
        const staffId = document.getElementById('directStaffId').value;
        if (staffId) {
            window.location.href = `staff-details.html?id=${staffId}`;
        } else {
            alert('Please enter a valid Staff ID.');
        }
    }

    window.onload = fetchStaff;
</script>
</body>
</html>
