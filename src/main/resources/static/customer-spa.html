<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .card-dashboard {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .card-dashboard:hover {
            transform: translateY(-5px);
        }
        .btn-action {
            margin-right: 5px;
        }
        .header-container {
            background-color: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            padding: 20px 0;
            margin-bottom: 30px;
        }
        .customer-form {
            max-width: 600px;
            margin: 0 auto;
        }
        .modal-content {
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="header-container">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <h1><i class="bi bi-people-fill text-primary"></i> Customer Management System</h1>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#customerModal">
                    <i class="bi bi-plus-circle"></i> Add New Customer
                </button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Alerts Container -->
        <div id="alerts"></div>
        
        <!-- Dashboard Summary -->
        <div class="row mb-4" id="dashboard">
            <div class="col-md-4">
                <div class="card card-dashboard bg-primary text-white">
                    <div class="card-body">
                        <h5 class="card-title"><i class="bi bi-people"></i> Total Customers</h5>
                        <h2 class="display-4" id="customerCount">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-dashboard bg-success text-white">
                    <div class="card-body">
                        <h5 class="card-title"><i class="bi bi-car-front"></i> Rented Vehicles</h5>
                        <h2 class="display-4" id="rentedCount">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-dashboard bg-info text-white">
                    <div class="card-body">
                        <h5 class="card-title"><i class="bi bi-check-circle"></i> Active Rentals</h5>
                        <h2 class="display-4" id="activeCount">0</h2>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Search and Filter -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-8">
                        <div class="input-group">
                            <input type="text" class="form-control" id="searchInput" placeholder="Search customers...">
                            <button class="btn btn-outline-secondary" type="button" id="searchButton">
                                <i class="bi bi-search"></i> Search
                            </button>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <select class="form-select" id="filterSelect">
                            <option value="all">All Customers</option>
                            <option value="active">Active Rentals</option>
                            <option value="returned">Returned Vehicles</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Customers Table -->
        <div class="card">
            <div class="card-header bg-light">
                <h3><i class="bi bi-table"></i> Customer List</h3>
            </div>
            <div class="card-body">
                <div class="alert alert-info" id="noCustomersMessage" style="display: none;">
                    <i class="bi bi-info-circle"></i> No customers found. Add a new customer to get started.
                </div>
                
                <div class="table-responsive">
                    <table class="table table-striped table-hover" id="customerTable">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Contact</th>
                                <th>Vehicle ID</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="customerTableBody">
                            <!-- Customer data will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Customer Modal (Add/Edit) -->
    <div class="modal fade" id="customerModal" tabindex="-1" aria-labelledby="customerModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="customerModalLabel">Add New Customer</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="customerForm" class="customer-form">
                        <input type="hidden" id="cusID" name="cusID">
                        
                        <div class="mb-3">
                            <label for="cusName" class="form-label">Customer Name</label>
                            <input type="text" class="form-control" id="cusName" name="cusName" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="contactNum" class="form-label">Contact Number</label>
                            <input type="number" class="form-control" id="contactNum" name="contactNum" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="driverLicenseNumber" class="form-label">Driver License Number</label>
                            <input type="number" class="form-control" id="driverLicenseNumber" name="driverLicenseNumber" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="rentedVehicle" class="form-label">Rented Vehicle ID</label>
                            <input type="number" class="form-control" id="rentedVehicle" name="rentedVehicle" required>
                        </div>
                        
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="returnrented" name="returnrented">
                            <label class="form-check-label" for="returnrented">Vehicle Returned</label>
                        </div>
                        
                        <div class="mb-3">
                            <label for="nodays" class="form-label">Number of Days</label>
                            <input type="number" class="form-control" id="nodays" name="nodays" value="1" min="1">
                        </div>
                        
                        <div class="text-end">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Save Customer</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Customer View Modal -->
    <div class="modal fade" id="viewCustomerModal" tabindex="-1" aria-labelledby="viewCustomerModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title" id="viewCustomerModalLabel">Customer Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="viewCustomerDetails">
                    <!-- Customer details will be loaded here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/customer.js"></script>
</body>
</html>
