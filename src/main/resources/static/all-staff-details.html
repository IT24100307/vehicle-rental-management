<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Staff Details - HTML Codex Template</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        body {
            font-family: 'Arial', sans-serif;
        }
        .container {
            margin-top: 30px;
        }
        .table th {
            background-color: #007bff;
            color: white;
        }
        footer {
            background-color: #f8f9fa;
            padding: 10px 0;
            text-align: center;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        .no-staff-message {
            text-align: center;
            margin: 20px 0;
            color: #666;
        }
    </style>
</head>
<body>
<!-- Header -->
<header class="bg-primary text-white text-center py-4">
    <h1>All Staff Details</h1>
</header>

<!-- Main Content -->
<div class="container">
    <div id="noStaffMessage" class="no-staff-message" style="display: none;">
        <p>No staff members found.</p>
    </div>
    <table id="staffTable" class="table table-bordered table-hover">
        <thead>
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Department</th>
        </tr>
        </thead>
        <tbody id="allStaffTableBody"></tbody>
    </table>
    <button class="btn btn-primary" onclick="window.location.href='index.html'">Back to Home</button>
</div>

<!-- Footer -->
<footer>
    <p>Template by <a href="https://htmlcodex.com" target="_blank">HTML Codex</a> | Licensed under <a href="https://creativecommons.org/licenses/by/4.0" target="_blank">CC BY 4.0</a></p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script>
    async function fetchAllStaff() {
        try {
            const response = await fetch('/api/staff');
            if (!response.ok) throw new Error('Failed to fetch staff members');
            const staff = await response.json();
            const tbody = document.getElementById('allStaffTableBody');
            const noStaffMessage = document.getElementById('noStaffMessage');
            const staffTable = document.getElementById('staffTable');
            tbody.innerHTML = '';
            if (staff.length === 0) {
                noStaffMessage.style.display = 'block';
                staffTable.style.display = 'none';
            } else {
                noStaffMessage.style.display = 'none';
                staffTable.style.display = 'table';
                staff.forEach(staffMember => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                            <td>${staffMember.id}</td>
                            <td>${staffMember.firstName}</td>
                            <td>${staffMember.lastName}</td>
                            <td>${staffMember.email}</td>
                            <td>${staffMember.phoneNumber}</td>
                            <td>${staffMember.department}</td>
                        `;
                    tbody.appendChild(row);
                });
            }
        } catch (error) {
            alert('Error fetching staff members: ' + error.message);
        }
    }

    window.onload = fetchAllStaff;
</script>
</body>
</html>
