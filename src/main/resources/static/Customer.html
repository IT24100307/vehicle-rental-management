<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Management</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .header-section {
            background-color: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            padding: 20px 0;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="header-section">
        <div class="container">
            <h1><i class="bi bi-people-fill text-primary"></i> Customer Management</h1>
        </div>
    </div>

    <div class="container">
        <!-- Alerts Container -->
        <div id="alerts"></div>
        
        <div class="row">
            <div class="col-md-6">
                <h2>Add Customer</h2>
                <form action="/customer/save" method="post" class="mb-4">
                    <div class="mb-3">
                        <label for="cusID" class="form-label">ID</label>
                        <input type="text" class="form-control" id="cusID" name="cusID" required>
                    </div>
                    <div class="mb-3">
                        <label for="cusName" class="form-label">Name</label>
                        <input type="text" class="form-control" id="cusName" name="cusName" required>
                    </div>
                    <div class="mb-3">
                        <label for="contactNum" class="form-label">Contact</label>
                        <input type="number" class="form-control" id="contactNum" name="contactNum" required>
                    </div>
                    <div class="mb-3">
                        <label for="driverLicenseNumber" class="form-label">License Number</label>
                        <input type="number" class="form-control" id="driverLicenseNumber" name="driverLicenseNumber" required>
                    </div>
                    <div class="mb-3">
                        <label for="rentedVehicle" class="form-label">Vehicle ID</label>
                        <input type="number" class="form-control" id="rentedVehicle" name="rentedVehicle" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Customer</button>
                </form>
            </div>
            
            <div class="col-md-6">
                <h2>Customer Details</h2>
                <div class="card">
                    <div class="card-body">
                        <div th:if="${customer != null}">
                            <p><strong>ID:</strong> <span th:text="${customer.cusID}"></span></p>
                            <p><strong>Name:</strong> <span th:text="${customer.cusName}"></span></p>
                            <p><strong>Contact:</strong> <span th:text="${customer.contactNum}"></span></p>
                            <p><strong>Vehicle ID:</strong> <span th:text="${customer.rentedVehicle}"></span></p>
                            
                            <div class="mt-3">
                                <a th:href="@{/customer/edit/{id}(id=${customer.cusID})}" class="btn btn-warning">Edit</a>
                                <a th:href="@{/customer/delete/{id}(id=${customer.cusID})}" 
                                   class="btn btn-danger"
                                   onclick="return confirm('Are you sure you want to delete this customer?')">Delete</a>
                            </div>
                        </div>
                        <div th:if="${customer == null}">
                            <p class="text-muted">No customer data available.</p>
                        </div>
                    </div>
                </div>
                
                <div class="mt-4">
                    <a href="/customer" class="btn btn-primary">View All Customers</a>
                </div>
            </div>
        </div>
        
        <hr class="my-5" />
        
        <h2><i class="bi bi-list-ul"></i> All Customers</h2>
        <a href="/customer/new" class="btn btn-success mb-3"><i class="bi bi-plus-circle"></i> Add New Customer</a>
        
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Contact</th>
                        <th>Vehicle</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${customers}">
                        <td th:text="${c.cusID}"></td>
                        <td th:text="${c.cusName}"></td>
                        <td th:text="${c.contactNum}"></td>
                        <td th:text="${c.rentedVehicle}"></td>
                        <td>
                            <a th:href="@{/customer/{id}(id=${c.cusID})}" class="btn btn-sm btn-info">View</a>
                            <a th:href="@{/customer/edit/{id}(id=${c.cusID})}" class="btn btn-sm btn-warning">Edit</a>
                            <a th:href="@{/customer/delete/{id}(id=${c.cusID})}" 
                               class="btn btn-sm btn-danger"
                               onclick="return confirm('Are you sure you want to delete this customer?')">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
