<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Rental System - Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="card register-card">
            <div class="card-header">
                <h2><i class="fas fa-user-plus"></i> Create an Account</h2>
                <p>Fill out the form to register</p>
            </div>
            <div class="card-body">
                <form id="registerForm">
                    <div class="form-group">
                        <label for="name"><i class="fas fa-user"></i> Full Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="email"><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="password"><i class="fas fa-lock"></i> Password</label>
                        <input type="password" id="password" name="password" placeholder="Create a password" required>
                    </div>
                    <div class="form-group">
                        <label for="contactNumber"><i class="fas fa-phone"></i> Contact Number</label>
                        <input type="text" id="contactNumber" name="contactNumber" placeholder="Enter your contact number" required>
                    </div>
                    <div class="form-group">
                        <label for="driverLicenseNumber"><i class="fas fa-id-card"></i> Driver License Number</label>
                        <input type="number" id="driverLicenseNumber" name="driverLicenseNumber" placeholder="Enter your driver license number" required>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary btn-block">
                            <i class="fas fa-user-plus"></i> Register
                        </button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <p>Already have an account? <a href="login.html">Login here</a></p>
                </div>
                <div id="error-message" class="error-message"></div>
            </div>
        </div>
    </div>
    <script src="js/register.js"></script>
</body>
</html>
